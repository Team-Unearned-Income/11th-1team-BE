plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'KnockIn'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext.jacocoExcludes = ['org/example/knockin/global/config/**', 'org/example/knockin/**/repository/impl/**', 'org/example/knockin/global/auth/**']
ext {
    springCloudVersion = "2025.1.3"
}

// Include every module so moving classes does not reduce the coverage scope.
gradle.projectsEvaluated {
    def testedProjects = allprojects.findAll { it.plugins.hasPlugin('java') }
    def testTasks = testedProjects.collect { it.tasks.named('test') }
    def coveredClasses = testedProjects.collect { p ->
        p.sourceSets.main.output.classesDirs.asFileTree.matching { exclude jacocoExcludes }
    }
    def coveredSources = testedProjects.collect { it.sourceSets.main.allJava.srcDirs }
    def coverageData = testedProjects.collect { it.layout.buildDirectory.file('jacoco/test.exec') }

    tasks.named('jacocoTestReport') {
        dependsOn testTasks
        classDirectories.setFrom(coveredClasses)
        sourceDirectories.setFrom(coveredSources)
        executionData.setFrom(coverageData)
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }
    tasks.named('jacocoTestCoverageVerification') {
        dependsOn testTasks
        classDirectories.setFrom(coveredClasses)
        sourceDirectories.setFrom(coveredSources)
        executionData.setFrom(coverageData)
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.00
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.dependsOn jacocoTestReport

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation project(':alarm')
    implementation project(':member')
    implementation project(':agreement')
    implementation project(':board')
    implementation project(':chat')
    implementation project(':declaration')
    implementation project(':global')
    implementation project(':inquiry')
    implementation project(':life')
    implementation project(':mate')
    implementation project(':meta')
    implementation project(':payment')
    implementation project(':room')
    implementation project(':util')
    implementation project(':verification')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'net.ttddyy:datasource-proxy:1.11.0'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'software.amazon.awssdk:s3:2.28.23'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.11'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
    implementation 'com.resend:resend-java:4.11.0'
    implementation 'com.svix:svix:1.44.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    testImplementation 'com.google.firebase:firebase-admin:9.9.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jpa'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2:2.3.232'
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'concurrency', 'performance'
    }

    maxHeapSize = "2g"
    maxParallelForks = 1

    finalizedBy jacocoTestReport
    finalizedBy jacocoTestCoverageVerification
}

tasks.register('concurrencyTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'concurrency'
    }
    shouldRunAfter test
}

tasks.register('performanceTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'performance'
    }
    environment 'RUN_PERFORMANCE_TESTS', 'true'
    shouldRunAfter test
}
