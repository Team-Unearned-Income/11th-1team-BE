<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">KnockIn 서비스 및 NAS 모니터링 인프라 구성도</title>
<desc id="desc">GitHub Actions와 Gradle을 통해 AWS EC2에 배포합니다. 모바일 클라이언트는 Spring Boot API를 호출하며, 애플리케이션은 Supabase, Cloudflare R2, Firebase, Resend, Kakao와 Apple에 연동됩니다. EC2의 Actuator 메트릭은 가정용 NAS의 Prometheus가 5초마다 수집하고, Alloy는 로그를 NAS의 Loki로 전송합니다. NAS에서 Docker Compose로 운영하는 Grafana는 메트릭과 로그를 조회합니다.</desc>
